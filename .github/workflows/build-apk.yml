name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk couleurs-darija.apk

      - name: Publish to GitHub Release (tag "latest")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: APK le plus récent
          body: Dernière version de l'application. Téléchargez `couleurs-darija.apk`.
          files: couleurs-darija.apk
          make_latest: true
